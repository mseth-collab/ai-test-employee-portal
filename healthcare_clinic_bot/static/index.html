<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunrise Family Health – Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Outfit:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f0f4f8;
      --surface: #ffffff;
      --primary: #0d9488;
      --primary-hover: #0f766e;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --bot-bg: #e6fffa;
      --user-bg: #0d9488;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.06), 0 2px 4px -2px rgb(0 0 0 / 0.04);
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
    }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 1.25rem;
      color: var(--text);
      margin: 0 0 0.5rem 0;
    }
    .subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }
    .chat-container {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 520px;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .msg {
      max-width: 85%;
      padding: 0.75rem 1rem;
      border-radius: 14px;
      font-size: 0.9375rem;
      line-height: 1.45;
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--bot-bg);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user-bg);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .msg strong {
      font-weight: 600;
    }
    .input-row {
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    #input {
      flex: 1;
      padding: 0.65rem 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.9375rem;
      outline: none;
      transition: border-color 0.2s;
    }
    #input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(13, 148, 136, 0.15);
    }
    #send {
      padding: 0.65rem 1.25rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: 'Outfit', sans-serif;
      font-weight: 500;
      font-size: 0.9375rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    #send:hover {
      background: var(--primary-hover);
    }
    #send:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .typing {
      color: var(--text-muted);
      font-size: 0.875rem;
      padding: 0.25rem 0;
    }
  </style>
</head>
<body>
  <h1>Sunrise Family Health</h1>
  <p class="subtitle">Ask about appointments, hours, or services</p>
  <div class="chat-container">
    <div class="messages" id="messages"></div>
    <div class="input-row">
      <input type="text" id="input" placeholder="Type your message..." autocomplete="off">
      <button type="button" id="send">Send</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    function addMessage(text, isUser) {
      const div = document.createElement('div');
      div.className = 'msg ' + (isUser ? 'user' : 'bot');
      // Escape HTML then allow **bold**
      const safe = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      div.innerHTML = safe.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setTyping(show) {
      let el = document.getElementById('typing');
      if (show) {
        if (!el) {
          el = document.createElement('div');
          el.id = 'typing';
          el.className = 'typing';
          el.textContent = '…';
          messagesEl.appendChild(el);
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }
      } else if (el) {
        el.remove();
      }
    }

    async function send() {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = '';
      addMessage(text, true);
      sendBtn.disabled = true;
      setTyping(true);
      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, session_id: 'default' }),
        });
        const data = await res.json();
        setTyping(false);
        addMessage(data.reply || 'Sorry, something went wrong.', false);
      } catch (e) {
        setTyping(false);
        addMessage('Unable to reach the server. Please try again.', false);
      }
      sendBtn.disabled = false;
      inputEl.focus();
    }

    sendBtn.addEventListener('click', send);
    inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

    // Welcome message
    addMessage(
      'Hello! Welcome to Sunrise Family Health. I can help with appointments, hours, location, and services. How can I help you today?',
      false
    );
    inputEl.focus();
  </script>
</body>
</html>
